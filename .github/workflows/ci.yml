name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier la présence des fichiers obligatoires
        run: |
          test -f skill/software-engineer/SKILL.md
          test -f skill/software-engineer/assets/context-template.md
          test -f skill/software-engineer/assets/agents-template.md
          test -f skill/software-engineer/assets/plan-template.md
          test -f dist/software-engineer.skill
          echo "✔ Tous les fichiers obligatoires sont présents."

      - name: Vérifier le frontmatter YAML du SKILL.md
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("skill/software-engineer/SKILL.md", "utf8");
            if (!src.startsWith("---")) throw new Error("frontmatter manquant");
            const end = src.indexOf("---", 3);
            if (end === -1) throw new Error("frontmatter non fermé");
            const fm = src.slice(3, end);
            for (const champ of ["name:", "description:"]) {
              if (!fm.includes(champ)) throw new Error("champ manquant : " + champ);
            }
            console.log("✔ Frontmatter valide.");
          '

      - name: Vérifier la syntaxe de l'installateur
        run: node --check bin/install.js && echo "✔ bin/install.js OK."

      - name: Tester l'installation (racine de test)
        run: |
          node bin/install.js --agent claude -g --yes --root "$RUNNER_TEMP/testroot"
          test -f "$RUNNER_TEMP/testroot/.claude/skills/software-engineer/SKILL.md" \
            && echo "✔ Installation testée avec succès."

      - name: Vérifier l'intégrité de l'archive .skill
        run: |
          node -e '
            const { execSync } = require("child_process");
            execSync("unzip -t dist/software-engineer.skill", { stdio: "inherit" });
            console.log("✔ Archive .skill intègre.");
          '
